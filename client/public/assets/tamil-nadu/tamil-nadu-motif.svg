<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none" opacity="0.12">
  <!-- Subtle Tamil Nadu Transit & Architectural Skyline Motif -->
  <path d="M0 180 L800 180" stroke="#1D7873" stroke-width="2" stroke-dasharray="8 6"/>
  
  <!-- Architectural Gopuram silhouettes stylized with clean geometric lines -->
  <g stroke="#1D7873" stroke-width="1.5" fill="none">
    <!-- Center Gopuram Silhouette -->
    <path d="M360 180 L370 120 L380 120 L385 80 L395 80 L397 50 L403 50 L405 80 L415 80 L420 120 L430 120 L440 180 Z"/>
    <path d="M375 120 L425 120"/>
    <path d="M388 80 L412 80"/>
    <circle cx="400" cy="35" r="4" fill="#F5C096"/>

    <!-- Left Tower Profile -->
    <path d="M160 180 L170 140 L180 140 L185 110 L195 110 L197 90 L203 90 L205 110 L215 110 L220 140 L230 140 L240 180 Z"/>
    <circle cx="200" cy="78" r="3" fill="#67958C"/>

    <!-- Right Tower Profile -->
    <path d="M560 180 L570 140 L580 140 L585 110 L595 110 L597 90 L603 90 L605 110 L615 110 L620 140 L630 140 L640 180 Z"/>
    <circle cx="600" cy="78" r="3" fill="#67958C"/>
  </g>

  <!-- Kolam grid geometric subtle dot constellation -->
  <g fill="#F5C096" opacity="0.6">
    <circle cx="100" cy="140" r="2"/>
    <circle cx="120" cy="140" r="2"/>
    <circle cx="110" cy="120" r="2"/>
    <circle cx="110" cy="160" r="2"/>

    <circle cx="680" cy="140" r="2"/>
    <circle cx="700" cy="140" r="2"/>
    <circle cx="690" cy="120" r="2"/>
    <circle cx="690" cy="160" r="2"/>
  </g>
</svg>

